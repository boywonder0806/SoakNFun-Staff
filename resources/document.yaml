                        createdDate:
                          description: Date and time when the order was created following ISO 8601 format.
                          type: string
                          format: date-time
                          example: '2024-04-24T18:23:46Z'
                        modifiedDate:
                          description: Date and time when the last time the order was modified. The value is updated when an order is created, the order status is updated, or a payment is successfully captured. It is also updated when a line item is added, removed, or modified, including changes such as applying discounts or price overrides.
                          type: string
                          format: date-time
                          example: '2024-04-24T18:23:46Z'
