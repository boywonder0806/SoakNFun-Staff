  /v1/oauth2/token:
    post:
      summary: Authenticate
      tags:
        - Authentication
      description: <h3>Authenticate using an API Key. Returns a JWT that is to be used to authenticate all subsequent API calls. The JWT expires after 1 hour.</h3>
      operationId: post-oauth2-token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
                - client_secret
                - scope
                - grant_type
              properties:
                client_id:
                  description: The ID of the client requesting API access.
                  type: string
                client_secret:
                  description: The secret of the client requesting API access.
                  type: string
                scope:
                  description: A space separated list of the scopes the client is requesting access for.
                  type: string
                grant_type:
                  description: Should always be `client_credentials`. Tells the token endpoint which grant type to issue.
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    description: The access token that clients can use to make subsequent API calls.
                    type: string
                  expiry:
                    description: The datetime when the access_token expires. The client will have to make the same call again to obtain a new access token.
                    type: string
                    format: datetime
