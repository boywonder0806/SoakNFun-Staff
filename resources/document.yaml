openapi: 3.1.0
info:
  title: RocketRez APIs [Beta]
  description: |-
    ![](assets/rocketrez-message.png)
    ## ⚠️ <span style="color:red">Beta Release</span> ⚠️
    This is currently in Beta release. As such you may encounter unexpected issues. Please inform your RocketRez contact of any feedback.
    ## 💫 Overview

    The RocketRez API provides a simple way for people to manage their data. This API is documented using **OpenAPI 3.1.0**.
    ## 🚀 Getting Started

    To begin using these APIs, you first must get your API credentials.
    Afterwards, make a `POST` request to the `api/v1/oauth2/token` endpoint with the following parameters in the request body:
      - `client_id`: this will be provided to you
      - `client_secret`: this will be provided to you
      - `scope`: for now use `read_orders`
      - `grant_type`: this should always be `client_credentials`

      You will be given a JSON Web Token (JWT) that expires in an hour. You will use that JWT to make future calls to the API by using it as the Bearer Token in the Authorization header.

      For more information please see the [token](#/operations/post-oauth2-token) endpoint.
  version: 0.0.0
servers:
  - url: https://secure.rocket-rez.com/api
    description: Production
tags:
  - name: Authentication
    description: Authentication
  - name: Orders
    description: Orders API
  - name: Memberships
    description: Memberships API
paths:
  /v1/orders:
    get:
      summary: List Orders
      tags:
        - Orders
      description: <h3>Returns a list of orders.</h3>
      operationId: get-orders
      parameters:
        - description: Start date for filtering orders in `yyyy-MM-dd` format. By default this value is in the company timezone configured in Rocket Office. This value is assumed to be at the start of the day, so a `startDate` and `endDate` of the same value will fetch results for that day. If no value is provided then `1970-01-01` is used.
          name: startDate
          in: query
          schema: &ref_4
            type: string
            format: date
            example: '1900-01-01'
          required: false
        - description: End date for filtering orders in `yyyy-MM-dd` format. By default this value is in the company timezone configured in Rocket Office. This value is assumed to be at the end of the day, so a `startDate` and `endDate` of the same value will fetch results for that day. If no value is provided then the end of the current day is used.
          name: endDate
          in: query
          schema: &ref_5
            type: string
            format: date
            example: '2024-06-01'
          required: false
        - description: Start date for filtering orders based on their last modification in `yyyy-MM-dd` format. Only orders modified on or after this date will be returned. By default this value is in the company timezone configured in Rocket Office. This value is assumed to be at the start of the day, so a `modifiedStartDate` and `modifiedEndDate` of the same value will fetch results for that day. If no value is provided then the `startDate` is used.
          name: modifiedStartDate
          in: query
          schema: &ref_6
            type: string
            format: date
            example: '1900-01-01'
          required: false
        - description: End date for filtering orders based on their last modification in `yyyy-MM-dd` format. Only orders modified on or before this date will be returned. By default this value is in the company timezone configured in Rocket Office. This value is assumed to be at the end of the day, so a `modifiedStartDate` and `modifiedEndDate` of the same value will fetch results for that day. If no value is provided then the end of the current day is used.
          name: modifiedEndDate
          in: query
          schema: &ref_7
            type: string
            format: date
            example: '2024-06-01'
          required: false
        - description: Size of pages used in pagination. By default this value is 250.
          name: pageSize
          in: query
          schema: &ref_8
            type: integer
            minimum: 1
            maximum: 250
          required: false
        - description: Index of the page to fetch. By default this value is 0.
          name: pageIndex
          in: query
          schema: &ref_9
            type: integer
            minimum: 0
          required: false
      security:
        - oAuth:
            - read_orders
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties: &ref_21
                  data:
                    description: The list of orders containing up to `pageSize` results
                    type: array
                    items:
                      type: object
                      properties: &ref_0
